  <main class="secao container formulario-pagina">
    <div class="formulario">
      <h2>Fale Conosco</h2>
      <p>Dúvidas sobre retirada em Curitiba ou produtos.</p>
      <br>
      <form onsubmit="enviarContato(event)">
        <div class="campo">
          <label for="nomeContato">Nome</label>
          <input type="text" id="nomeContato" required>
        </div>
        <div class="campo">
          <label for="emailContato">E-mail</label>
          <input type="email" id="emailContato" required>
        </div>
        <div class="campo">
          <label for="mensagemContato">Mensagem</label>
          <textarea id="mensagemContato" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn" style="width:100%;">Enviar Mensagem</button>
      </form>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>© 2026 Autoeletric - Curitiba/PR</p>
    </div>
  </footer>
